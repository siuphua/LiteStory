<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="zom21CRHNxePCDpzH955zP">
<head data-page-node-id="u5BqFXoAsibaSPMwYEHaa9">
<meta charset="utf-8" data-page-node-id="eNucpmvIG0LEN06IfUSpAw">
<meta name="viewport" content="width=device-width, initial-scale=1" data-page-node-id="RCe6RZSjQ51dGHXClCp4Fh">
<title>故事产物查看</title>
<style>
  :root{--line:#222;--muted:#888;}
  *{box-sizing:border-box;}
  body{margin:0;background:#fff;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6;}
  .wrap{max-width:860px;margin:0 auto;padding:24px 18px 60px;}
  header{border-bottom:2px solid var(--line);padding-bottom:12px;margin-bottom:18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  header a{color:#1558d6;text-decoration:none;font-size:14px;white-space:nowrap;}
  h1{font-size:20px;margin:0;font-weight:700;flex:1;min-width:160px;word-break:break-all;}
  main{min-height:200px;}
  .loading,.err{color:var(--muted);}
  .err{color:#c00;}
  pre{white-space:pre-wrap;word-break:break-all;background:#fafafa;border:1px solid #eee;border-radius:6px;padding:14px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;max-height:70vh;overflow:auto;}
  audio,video{width:100%;max-width:560px;display:block;margin:8px 0;}
  .meta{color:var(--muted);font-size:12px;margin:6px 0 14px;word-break:break-all;}
  .raw{display:inline-block;margin-top:12px;color:#1558d6;font-size:13px;text-decoration:none;border:1px solid #ddd;border-radius:4px;padding:6px 12px;}
  .raw:hover{background:#fafafa;}
  .copy-row{margin-top:14px;}
  .copy{font-size:13px;color:#1558d6;border:1px solid #1558d6;border-radius:4px;padding:6px 14px;cursor:pointer;background:#fff;}
  .copy:hover{background:#1558d6;color:#fff;}
  .toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9;}
  .toast.show{opacity:1;}
</style>
</head>
<body data-page-node-id="Q6geGB4AITIl7DSigGLtkM">
<div class="wrap" data-page-node-id="Krr1hUQ4dSiPodTuHdhtLB">
  <header data-page-node-id="xBbFvaL57RfvtJa6C8eU6t">
    <a href="stories_index.html" data-page-node-id="XoeE5ABHh1cYFCQhq1QnZZ">&lsaquo; 返回列表</a>
    <h1 id="title" data-page-node-id="192sJ4dmtSqaf3uWew3qpp">故事产物查看</h1>
  </header>
  <main id="content" data-page-node-id="b4krhMKfsvpB6uhtKnVnbd"><p class="loading" data-page-node-id="71ntJuFfDyj02QwDFjq2wO">加载中…</p></main>
</div>
<div class="toast" id="toast" data-page-node-id="19PcOiG9FuNpOIoaj0FveQ"></div>
<script>
function escapeHtml(s){return s.replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},1600);}
function fallbackCopy(text){var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);}
function copyLink(btn){var u=btn.getAttribute('data-url');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(u).then(function(){toast('已复制链接');},function(){fallbackCopy(u);toast('已复制链接');});}else{fallbackCopy(u);toast('已复制链接');}}

var params=new URLSearchParams(location.search);
var file=params.get('file')||'';
var content=document.getElementById('content');
var title=document.getElementById('title');

if(!file){
  content.innerHTML='<p class="err">缺少 file 参数。</p>';
}else{
  title.textContent=decodeURIComponent(file.split('/').pop());
  var lower=file.toLowerCase();
  if(/\.(mp3|wav|m4a|ogg)$/.test(lower)){
    content.innerHTML='<div class="meta">'+escapeHtml(file)+'</div>'
      +'<audio controls src="'+file+'"></audio>'
      +'<div class="copy-row"><a class="raw" href="'+file+'" target="_blank" rel="noopener">在新窗口打开原始文件</a></div>';
  }else if(/\.(mp4|webm|mov)$/.test(lower)){
    content.innerHTML='<div class="meta">'+escapeHtml(file)+'</div>'
      +'<video controls src="'+file+'"></video>'
      +'<div class="copy-row"><a class="raw" href="'+file+'" target="_blank" rel="noopener">在新窗口打开原始文件</a></div>';
  }else if(/\.(md|yaml|yml|json|txt|csv)$/.test(lower)){
    fetch(file).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text();}).then(function(t){
      content.innerHTML='<div class="meta">'+escapeHtml(file)+'</div><pre>'+escapeHtml(t)+'</pre>'
        +'<div class="copy-row"><button class="copy" data-url="'+file+'">复制链接</button> '
        +'<a class="raw" href="'+file+'" target="_blank" rel="noopener">在新窗口打开原始文件</a></div>';
    }).catch(function(e){
      content.innerHTML='<p class="err">无法加载：'+e.message+'</p><div class="meta">'+escapeHtml(file)+'</div>'
        +'<div class="copy-row"><button class="copy" data-url="'+file+'">复制链接</button> '
        +'<a class="raw" href="'+file+'" target="_blank" rel="noopener">直接打开原始文件</a></div>';
    });
  }else{
    content.innerHTML='<div class="meta">'+escapeHtml(file)+'</div>'
      +'<div class="copy-row"><button class="copy" data-url="'+file+'">复制链接</button> '
      +'<a class="raw" href="'+file+'" target="_blank" rel="noopener">打开原始文件</a></div>';
  }
}
document.addEventListener('click',function(e){
  var b=e.target.closest?e.target.closest('.copy'):null;
  if(b){e.preventDefault();copyLink(b);}
});
</script>
</body>
</html>
